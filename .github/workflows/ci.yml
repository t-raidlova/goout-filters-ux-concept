# Lint, unit tests and build, then end-to-end tests against that build, on every pull
# request and push to main. Pushes to main deploy to GitHub Pages only if both jobs pass.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On a pull request, a newer push cancels the older run. On main, runs queue instead,
# so a deployment that has started is never cancelled halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The E2E job tests this exact build instead of building again.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  e2e:
    name: E2E (Chromium, WebKit, mobile)
    # Don't spend runner time on E2E when lint, unit tests or the build already failed.
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # E2E_SKIP_BUILD: serve the downloaded build (see playwright.config.ts).
      - run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: '1'

      # Report with traces and screenshots of failed tests: Actions run → Artifacts.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: [checks, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; don't cancel a deployment that's already running.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
